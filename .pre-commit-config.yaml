# Local frontend checks, preserving the starter quality gates.
minimum_pre_commit_version: "4.0.0"
repos:
  - repo: local
    hooks:
      - id: web-lint
        name: Frontend lint
        entry: npm --prefix web run lint
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: web-format
        name: Frontend format
        entry: npm --prefix web run format:check
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: web-types
        name: Frontend types
        entry: npm --prefix web run typecheck
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: web-unit
        name: Frontend unit
        entry: npm --prefix web run test
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: web-browser
        name: Frontend browser
        entry: npm --prefix web run test:e2e -- --project=chromium
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
